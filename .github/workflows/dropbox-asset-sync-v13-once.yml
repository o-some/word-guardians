name: Dropbox Asset Sync V13 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dropbox-asset-sync-v13-once.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install browser uploader
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Upload to Dropbox file requests
        run: node scripts/dropbox-sync-v13.mjs
      - name: Clean temporary sync files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dropbox-asset-sync-v13-once.yml scripts/dropbox-sync-v13.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Dropbox Word Guardians asset sync'
          git pull --rebase origin main
          git push origin HEAD:main
