name: Import Original Boss Sprites Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-boss-assets-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original freigestellte Tula bosses from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/bosses
          curl -L --fail --retry 2 'https://uc1c6014493d67479cd6486d7ff6.dl.dropboxusercontent.com/cd/0/get/DGhWE87q9JobKGhr7ekT4w8s4nTHacVi2B893rZOyLcefamoz57enSaw-YSksYBbhX8G-vlrxw791lF1mkCkASEpoIA3JawjJRoqjlahiY-1ZygEvotO47qWFPXWOBZ9nC3MmC4dk1MAT_ou5a-bod7FCvF5Zuij9-7B4ODNq9h2_w/file?c_luid=88361d58' -o assets/bosses/boss-01-pirat-kai.png
