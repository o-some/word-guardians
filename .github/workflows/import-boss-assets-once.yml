          for f in assets/bosses/boss-*.png; do test -s "$f"; file "$f" | grep -qi PNG; done

      - name: Commit imported boss assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-boss-assets-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bosses .github/workflows/import-boss-assets-once.yml
          git commit -m 'Import original freigestellte Tula boss sprites'
          git pull --rebase origin main
          git push origin HEAD:main
