name: Import Pirate Sprites
# second push intentionally triggers this one-shot importer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pirate-sprites.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import 10 transparent Tula pirate sprites from Dropbox package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://uca6437ac548184a721f512ea4d8.dl.dropboxusercontent.com/cd/0/get/DGjCi4yookFKBxTTOrvnwKxoO1OujjYr5xtlwRq9HA-xWLLtZWYPkkDH7Bzq_ch0Y8nB0JVwLcINU-huarOxHuK0dQDFOjUlTaLVdRTm_2mhKD3LcXEupvGqFsCqWp_0lwmHwwC2NfYi6wEokSpLcKxDZyfUAMCdFgjoTUHoSWoMMA/file?c_luid=88361d58' -o /tmp/tula-bosses.zip
          rm -rf /tmp/tula-bosses
          mkdir -p /tmp/tula-bosses assets/pirates
          unzip -q -j /tmp/tula-bosses.zip -d /tmp/tula-bosses
          python - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('/tmp/tula-bosses')
          dst=Path('assets/pirates')
          mapping={
            1:'level-1-pirat-kai.png',
            2:'level-2-kapitaen-brax.png',
            3:'level-3-blackfinn.png',
            4:'level-4-alt-kapitaen-roderick.png',
            5:'level-5-piratenbaron-vargas.png',
            6:'level-6-kapitaen-ironhook.png',
            7:'level-7-admiral-thorne.png',
            8:'level-8-kartenmeister-corvin.png',
            9:'level-9-schattenfuerst-azrak.png',
            10:'level-10-piratenkoenig-varkos.png',
          }
          files=list(src.glob('*.png'))
          if len(files)<10: raise SystemExit(f'Expected 10 PNGs, got {len(files)}: {[p.name for p in files]}')
          for level,out in mapping.items():
              matches=[p for p in files if p.name.lower().startswith(f'level {level} -')]
              if len(matches)!=1: raise SystemExit(f'Level {level}: {matches}')
              shutil.copy2(matches[0],dst/out)
          PY
          for f in assets/pirates/*.png; do test -s "$f"; file "$f" | grep -qi PNG; done

      - name: Upgrade sprites and micro-animation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('v1.0.0-migrated · 4×8','v1.1.0 · TULA PIRATES · 4×8')
          old_css=".pirateSkin{font-size:29px;animation:walk .48s ease-in-out infinite alternate}.enemy.fast .pirateSkin{animation-duration:.27s}.enemy.heavy .pirateSkin{font-size:33px;animation:stomp .65s ease-in-out infinite}"
          new_css=".pirateSkin{display:block;width:54px;height:62px;object-fit:contain;transform-origin:50% 88%;filter:drop-shadow(0 7px 5px #0009) drop-shadow(0 0 5px #56d7d533);will-change:transform,filter}.enemy.fast .pirateSkin{width:50px;height:58px}.enemy.heavy .pirateSkin{width:60px;height:68px}.enemy.elite .pirateSkin{width:64px;height:72px;filter:drop-shadow(0 8px 6px #000a) drop-shadow(0 0 11px #efc76666)}.enemy::after{content:'';position:absolute;left:50%;bottom:9px;width:38px;height:8px;border-radius:50%;background:#00152277;filter:blur(2px);transform:translateX(-50%);z-index:-1}.enemy .name{box-shadow:0 2px 6px #0007}.enemy.elite .name{color:#fff0ad;border:1px solid #efc76677}.enemy.elite .hp{width:50px;height:6px;box-shadow:0 0 7px #efc76655}.pirateSkin.hitFlash{animation:pirateHit .22s ease}"
          if old_css not in s: raise SystemExit('Old pirate CSS not found')
          s=s.replace(old_css,new_css)
          s=s.replace("@keyframes walk{to{transform:translateY(-3px) rotate(3deg)}}@keyframes stomp{50%{transform:translateY(-4px) scale(1.06)}}","@keyframes walk{to{transform:translateY(-3px) rotate(3deg)}}@keyframes stomp{50%{transform:translateY(-4px) scale(1.06)}}@keyframes pirateHit{30%{transform:translateX(-4px) rotate(-4deg) scale(1.05);filter:brightness(1.9) drop-shadow(0 0 10px #fff)}70%{transform:translateX(3px) rotate(3deg)}}")
          old="const PIRATES=[{n:'Deckpirat',icon:'🏴‍☠️',hp:78,sp:.31,cl:''},{n:'Hakenpirat',icon:'🪝',hp:105,sp:.44,cl:'fast'},{n:'Kanonenpirat',icon:'💣',hp:175,sp:.24,cl:'heavy'},{n:'Pulverkapitän',icon:'☠️',hp:235,sp:.22,cl:'heavy'}];"
          new="const PIRATES=[{n:'Pirat Kai',img:'./assets/pirates/level-1-pirat-kai.png',hp:78,sp:.31,cl:''},{n:'Kapitän Brax',img:'./assets/pirates/level-2-kapitaen-brax.png',hp:95,sp:.34,cl:''},{n:'Blackfinn',img:'./assets/pirates/level-3-blackfinn.png',hp:112,sp:.42,cl:'fast'},{n:'Alt-Kapitän Roderick',img:'./assets/pirates/level-4-alt-kapitaen-roderick.png',hp:145,sp:.28,cl:'heavy'},{n:'Piratenbaron Vargas',img:'./assets/pirates/level-5-piratenbaron-vargas.png',hp:175,sp:.30,cl:'heavy'},{n:'Kapitän Ironhook',img:'./assets/pirates/level-6-kapitaen-ironhook.png',hp:205,sp:.33,cl:'elite'},{n:'Admiral Thorne',img:'./assets/pirates/level-7-admiral-thorne.png',hp:245,sp:.31,cl:'elite heavy'},{n:'Kartenmeister Corvin',img:'./assets/pirates/level-8-kartenmeister-corvin.png',hp:280,sp:.37,cl:'elite'},{n:'Schattenfürst Azrak',img:'./assets/pirates/level-9-schattenfuerst-azrak.png',hp:335,sp:.38,cl:'elite fast'},{n:'Piratenkönig Varkos',img:'./assets/pirates/level-10-piratenkoenig-varkos.png',hp:420,sp:.29,cl:'elite heavy'}];"
          if old not in s: raise SystemExit('PIRATES block not found')
          s=s.replace(old,new)
          if "n:p.n,icon:p.icon,cl:p.cl" not in s: raise SystemExit('spawn payload not found')
          s=s.replace("n:p.n,icon:p.icon,cl:p.cl","n:p.n,img:p.img,cl:p.cl")
          old_render="d.innerHTML='<span class=\"pirateSkin\">'+e.icon+'</span><span class=\"name\">'+e.n+'</span><span class=\"hp\"><i style=\"width:'+Math.max(0,e.hp/e.max*100)+'%\"></i></span>';"
          new_render="const bob=Math.sin((S.time*(e.cl.includes('fast')?7.2:4.8))+(e.id*.73))*(e.cl.includes('heavy')?1.7:3.2),tilt=Math.sin((S.time*(e.cl.includes('fast')?5.5:3.3))+(e.id*.41))*(e.cl.includes('fast')?3.6:1.8),squash=e.cl.includes('heavy')?1+Math.sin(S.time*5+e.id)*.025:1;d.innerHTML='<img class=\"pirateSkin\" src=\"'+e.img+'\" alt=\"'+e.n+'\" style=\"transform:translateY('+bob+'px) rotate('+tilt+'deg) scaleY('+squash+')\"><span class=\"name\">'+e.n+'</span><span class=\"hp\"><i style=\"width:'+Math.max(0,e.hp/e.max*100)+'%\"></i></span>';"
          if old_render not in s: raise SystemExit('enemy render block not found')
          s=s.replace(old_render,new_render)
          s=s.replace('<p>4×8 Endless-Run. Richtige Wörter entfesseln die blaue Wortwelle. Falsche Antworten kosten jeden gesetzten Helfer 10 % seiner maximalen HP.</p>','<p>4×8 Endless-Run mit der echten Tula-Piratencrew. Zehn Piraten-Skins aus Tula’s Island werden mit steigender Gefahr immer mächtiger.</p>')
          p.write_text(s)

      - name: Document sprite provenance
        shell: bash
        run: |
          cat >> docs/ASSET_MANIFEST.md <<'EOF'

## Pirate sprite upgrade v1.1.0
Source: Dropbox `/[LinguaTurtle]/[Endbosse]/Tulas_Island_10_Original_Bosse_Einzeln_v2/[Freigestellt]/`.
Imported as local runtime assets: Pirat Kai, Kapitän Brax, Blackfinn, Alt-Kapitän Roderick, Piratenbaron Vargas, Kapitän Ironhook, Admiral Thorne, Kartenmeister Corvin, Schattenfürst Azrak and Piratenkönig Varkos.
Runtime path: `assets/pirates/`.
Visual treatment: transparent source PNGs are preserved; movement, shadow, glow, size hierarchy and micro-animation are applied at runtime via CSS/JS.
EOF

      - name: Commit one-shot import
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-pirate-sprites.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/pirates docs/ASSET_MANIFEST.md .github/workflows/import-pirate-sprites.yml
          git commit -m 'Upgrade Word Guardians with animated Tula pirate sprites'
          git pull --rebase origin main
          git push origin HEAD:main
