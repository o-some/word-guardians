name: Import Pirate Sprites

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-pirate-sprites.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Dropbox pirate sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pirates
          curl -L --fail --retry 2 'https://ucfe10c68ccdabe22ac756b3b6d3.dl.dropboxusercontent.com/cd/0/get/DGjsf_U8umIN7w5SBMDkrStsOQoB1vP4DdC93TvTpZWg4u_yK25wBPHuVip4j7iISEbRlXwGdWsKgcBWf-u9ac5AMhOgO9UjHbz1j1cYJbO05yCWXNQ0n1oSvW8IRi0QMes7SqHNQkKPkYCDIXTtfHZwjC9x5e2wa2n2PqEVmP7w8Q/file?c_luid=88361d58' -o assets/pirates/level-1-pirat-kai.png
          curl -L --fail --retry 2 'https://uc2e704354b3da98ba74ccf9b470.dl.dropboxusercontent.com/cd/0/get/DGjwSxH-tmC-aub5d4tJt6dTHHMLw8pE6VOw5KgOC8y0iS9_rAETW4egAWqRAPnJWFmxQ6b2NO54SS_ZmyfrxqRftJHU0DEBp-lN6EkAYBc4KH48j1Oc0vGebGVX2-KKfi_YDq2vRRD-IJwzLQ7Keocf4rXq9bLDyxNVNldf96ferw/file?c_luid=88361d58' -o assets/pirates/level-2-kapitaen-brax.png
          curl -L --fail --retry 2 'https://ucf5591200dabe9498b5b576759b.dl.dropboxusercontent.com/cd/0/get/DGi_r47TOLuDteajHoZd0g0jK4rBOc2OEs-dhA4epj9tzXoc6KaHsZYVGj4K0egqd63M7DPinFfQbtR2OhFxQjnWpvEgkXGPfIstiWhR4czYeQFOdI2dORj58xgBeObUlTpp4hDRSkLdFMxFqnCH5-o5ViDi5uliYZQVU2SAH8SPLg/file?c_luid=88361d58' -o assets/pirates/level-3-blackfinn.png
          curl -L --fail --retry 2 'https://uc7530cf61aebf74b6a578a854dc.dl.dropboxusercontent.com/cd/0/get/DGgmU9M7ym07kcJenULyAHUwkpXcEjtAkvzm9h0DgjlbWsBW_AbjUZwqaz22aWLnSQRA2sGzoRcfxKyGOybO5-2ybEI-gtUbJjnpR0GUKkRR3R4nTgyGt4xnoehYvkiaPvqkVIcSiU1BgEQ5mYFFJbkZjFrQWrF22sG9KmLE3hwW8w/file?c_luid=88361d58' -o assets/pirates/level-4-alt-kapitaen-roderick.png
          curl -L --fail --retry 2 'https://uc4ea6e37b07723021a2f829656b.dl.dropboxusercontent.com/cd/0/get/DGiWjFjQUUcRuyyvowzsgpsiOTFW0RcAOXEXO5B-l1SKb62VUQgpM07W9Rwuj2-2FUbShevOR8VFvrDr6nWHuXao15U3ZTmkhyKQ43YYlvgsPWt3o0-Nu4RQjiw3VKBk8vkgkHeIzAm34O3MTXAiMhPGDsMrxzRoF5zS1_CsqaMNGA/file?c_luid=88361d58' -o assets/pirates/level-5-piratenbaron-vargas.png
          curl -L --fail --retry 2 'https://ucba840e2a83d9993586276e558f.dl.dropboxusercontent.com/cd/0/get/DGhCQOmjWTt84e6IQkL3ENWdRinNurzgiI8MIx-3st0HHmOCG3ez_NJfFe7kSGnb19DwBeYVwtrGqjUbr-yzUAgCLxFv_bBb2pjp9fpYcWhR6jjF9UuVyanOwe7FUnH2xhCu8WWUWWHb-5B9Zv_7msPGxCFg12vIthj3ewA9l8PXgA/file?c_luid=88361d58' -o assets/pirates/level-6-kapitaen-ironhook.png
          curl -L --fail --retry 2 'https://uc40198a8f364711a470ec855a7b.dl.dropboxusercontent.com/cd/0/get/DGjAubB6h7UNzubiaSMnmxenNaENYd7TDa5yVThjrSU2milYNYmURs9gmyt6VaMoB-cnYA85-HeXVEf8-xn1O7nwbG1jzOfdx9C_N9Dz3AZ4rHgMkHxq1nSYOLSFk4uzo56DvR0JsZZxTyRjpruEUu8W2TXKAB4e-gM9xorB0tKRGA/file?c_luid=88361d58' -o assets/pirates/level-7-admiral-thorne.png
          curl -L --fail --retry 2 'https://uc1e0ad2d7d8bc6f38985ee6da09.dl.dropboxusercontent.com/cd/0/get/DGjBqnsKIgD2J8QjiqIOQeWr48wVX6xiAs9xsdLqc7RALy2eHyJHuuv5MPLMSXwtbiBUNXWXHZw_6SVMVPJREZeF4Ih40py2kQhAYkFy9l59a8ceMsRiUAAfRteGi94fO0timhfrrKOSrcWvW8Dm2Mv7Pl78kEefCdTiMy9dpv2IjQ/file?c_luid=88361d58' -o assets/pirates/level-8-kartenmeister-corvin.png
          curl -L --fail --retry 2 'https://uc851c109ce43692912b7aa0fa19.dl.dropboxusercontent.com/cd/0/get/DGj4GiY_RakFNPHXaCJ7vrP1mCTSxDJ0X4ciSbiKe4NyzAfkbraJetHofjhCBVmtcEsayImHUye3Hf7uPgxnZCQiFqrEkt_B4hr1_MgvvkqqFZTAbHz-yFN5PY3sApqd533l7P2jI5nD2SNhqEs2lq09YXAFHMUI7u3gcGVyIdm10g/file?c_luid=88361d58' -o assets/pirates/level-9-schattenfuerst-azrak.png
          curl -L --fail --retry 2 'https://uc7ac8bd23aef86ef06256d7835e.dl.dropboxusercontent.com/cd/0/get/DGiznK5H2AxthFiTxreYYW1tAvn5sFIYWh_CZHzxy-tF0dwl9R2Z62OpdTmDq54gYoxJxnlrJ1zS8RaY1vkaqZK48q95elEVJ7L9qsYhZ2tbdrd-IBh0oeGuTjC8vCujLBTis7ZVp-qeCVT1OVcLWj1q0A8n84qPYH0psEKr9ggHJg/file?c_luid=88361d58' -o assets/pirates/level-10-piratenkoenig-varkos.png
          for f in assets/pirates/*.png; do test -s "$f"; file "$f" | grep -qi PNG; done
      - name: Upgrade game sprites and animation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("v1.0.0-migrated · 4×8","v1.1.0 · TULA PIRATES · 4×8")
          s=s.replace(".pirateSkin{font-size:29px;animation:walk .48s ease-in-out infinite alternate}.enemy.fast .pirateSkin{animation-duration:.27s}.enemy.heavy .pirateSkin{font-size:33px;animation:stomp .65s ease-in-out infinite}",".pirateSkin{display:block;width:54px;height:62px;object-fit:contain;transform-origin:50% 88%;filter:drop-shadow(0 7px 5px #0009) drop-shadow(0 0 5px #56d7d533)}.enemy.fast .pirateSkin{width:50px;height:58px}.enemy.heavy .pirateSkin{width:60px;height:68px}.enemy.elite .pirateSkin{width:64px;height:72px;filter:drop-shadow(0 8px 6px #000a) drop-shadow(0 0 10px #efc76666)}.enemy::after{content:'';position:absolute;left:50%;bottom:9px;width:38px;height:8px;border-radius:50%;background:#00152266;filter:blur(2px);transform:translateX(-50%);z-index:-1}.enemy.hit .pirateSkin{animation:pirateHit .22s ease}.enemy .name{box-shadow:0 2px 6px #0007}.enemy.elite .name{color:#fff0ad;border:1px solid #efc76677}.enemy.elite .hp{width:50px;height:6px;box-shadow:0 0 7px #efc76655}")
          s=s.replace("@keyframes walk{to{transform:translateY(-3px) rotate(3deg)}}@keyframes stomp{50%{transform:translateY(-4px) scale(1.06)}}","@keyframes walk{to{transform:translateY(-3px) rotate(3deg)}}@keyframes stomp{50%{transform:translateY(-4px) scale(1.06)}}@keyframes pirateHit{30%{transform:translateX(-4px) rotate(-4deg);filter:brightness(1.8) drop-shadow(0 0 10px #fff)}70%{transform:translateX(3px) rotate(3deg)}}")
          old="const PIRATES=[{n:'Deckpirat',icon:'🏴‍☠️',hp:78,sp:.31,cl:''},{n:'Hakenpirat',icon:'🪝',hp:105,sp:.44,cl:'fast'},{n:'Kanonenpirat',icon:'💣',hp:175,sp:.24,cl:'heavy'},{n:'Pulverkapitän',icon:'☠️',hp:235,sp:.22,cl:'heavy'}];"
          new="const PIRATES=[{n:'Pirat Kai',img:'./assets/pirates/level-1-pirat-kai.png',hp:78,sp:.31,cl:''},{n:'Kapitän Brax',img:'./assets/pirates/level-2-kapitaen-brax.png',hp:95,sp:.34,cl:''},{n:'Blackfinn',img:'./assets/pirates/level-3-blackfinn.png',hp:112,sp:.42,cl:'fast'},{n:'Alt-Kapitän Roderick',img:'./assets/pirates/level-4-alt-kapitaen-roderick.png',hp:145,sp:.28,cl:'heavy'},{n:'Piratenbaron Vargas',img:'./assets/pirates/level-5-piratenbaron-vargas.png',hp:175,sp:.30,cl:'heavy'},{n:'Kapitän Ironhook',img:'./assets/pirates/level-6-kapitaen-ironhook.png',hp:205,sp:.33,cl:'elite'},{n:'Admiral Thorne',img:'./assets/pirates/level-7-admiral-thorne.png',hp:245,sp:.31,cl:'elite heavy'},{n:'Kartenmeister Corvin',img:'./assets/pirates/level-8-kartenmeister-corvin.png',hp:280,sp:.37,cl:'elite'},{n:'Schattenfürst Azrak',img:'./assets/pirates/level-9-schattenfuerst-azrak.png',hp:335,sp:.38,cl:'elite fast'},{n:'Piratenkönig Varkos',img:'./assets/pirates/level-10-piratenkoenig-varkos.png',hp:420,sp:.29,cl:'elite heavy'}];"
          if old not in s: raise SystemExit('PIRATES block not found')
          s=s.replace(old,new)
          old_render="d.innerHTML='<span class=\"pirateSkin\">'+e.icon+'</span><span class=\"name\">'+e.n+'</span><span class=\"hp\"><i style=\"width:'+Math.max(0,e.hp/e.max*100)+'%\"></i></span>';"
          new_render="const bob=Math.sin((S.time*5)+(e.id*.73))*(e.cl.includes('heavy')?1.7:3.2),tilt=Math.sin((S.time*3.4)+(e.id*.41))*(e.cl.includes('fast')?3.4:1.8);d.innerHTML='<img class=\"pirateSkin\" src=\"'+e.img+'\" alt=\"'+e.n+'\" style=\"transform:translateY('+bob+'px) rotate('+tilt+'deg)\"><span class=\"name\">'+e.n+'</span><span class=\"hp\"><i style=\"width:'+Math.max(0,e.hp/e.max*100)+'%\"></i></span>';"
          if old_render not in s: raise SystemExit('enemy render block not found')
          s=s.replace(old_render,new_render)
          s=s.replace("n:p.n,icon:p.icon,cl:p.cl","n:p.n,img:p.img,cl:p.cl")
          s=s.replace("<p>4×8 Endless-Run. Richtige Wörter entfesseln die blaue Wortwelle. Falsche Antworten kosten jeden gesetzten Helfer 10 % seiner maximalen HP.</p>","<p>4×8 Endless-Run mit der echten Tula-Piratencrew. Die Piraten werden mit jeder Gefahrenstufe stärker und lebendiger animiert.</p>")
          p.write_text(s)
      - name: Document imported sprites
        shell: bash
        run: |
          cat >> docs/ASSET_MANIFEST.md <<'EOF'

## Pirate sprite upgrade v1.1.0
Source: Dropbox `/[LinguaTurtle]/[Endbosse]/Tulas_Island_10_Original_Bosse_Einzeln_v2/[Freigestellt]/`.
Imported 10 transparent PNG boss/pirate sprites: Pirat Kai, Kapitän Brax, Blackfinn, Alt-Kapitän Roderick, Piratenbaron Vargas, Kapitän Ironhook, Admiral Thorne, Kartenmeister Corvin, Schattenfürst Azrak, Piratenkönig Varkos.
Runtime path: `assets/pirates/`.
EOF
      - name: Commit sprite upgrade
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-pirate-sprites.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/pirates docs/ASSET_MANIFEST.md .github/workflows/import-pirate-sprites.yml
          git commit -m 'Upgrade Word Guardians with Tula pirate sprites'
          git pull --rebase origin main
          git push origin HEAD:main
