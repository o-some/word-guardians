name: Migration QA
# Regression run for Word Guardians gameplay, mobile performance and endscreen changes.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: word-guardians-migration-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static build
        id: build
        continue-on-error: true
        run: npm run build > /tmp/build.log 2>&1
      - name: Install browser QA
        id: install
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.55.0 > /tmp/install.log 2>&1
          npx playwright install --with-deps chromium webkit >> /tmp/install.log 2>&1
      - name: Live and gameplay QA
        id: gameplay
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          # Keep historical regression scripts aligned with the current release label without changing their gameplay assertions.
          sed -i 's/v1\.9\.5 · LARGE OVERLAYS + PREMIUM GUIDE/v1.9.9 · INFO CLEANUP/g; s/v1\.9\.6 · LARGE QUESTION + GUARDIAN DOCK/v1.9.9 · INFO CLEANUP/g; s/v1\.9\.7 · WAVE STABILITY/v1.9.9 · INFO CLEANUP/g; s/v1\.9\.8 · PREMIUM READABILITY/v1.9.9 · INFO CLEANUP/g; s/v1\.9\.5/v1.9.9/g; s/v1\.9\.6/v1.9.9/g; s/v1\.9\.7/v1.9.9/g; s/v1\.9\.8/v1.9.9/g' tests/qa.mjs tests/onboarding-v180.mjs tests/mobile-scale-v196.mjs tests/wave-stability-v197.mjs tests/readability-v198.mjs
          node tests/qa.mjs > /tmp/qa.log 2>&1
          node tests/layout-regression-v176.mjs >> /tmp/qa.log 2>&1
          node tests/healing-v178.mjs >> /tmp/qa.log 2>&1
          node tests/onboarding-v180.mjs >> /tmp/qa.log 2>&1
          node tests/damage-v190.mjs >> /tmp/qa.log 2>&1
          node tests/mobile-scale-v196.mjs >> /tmp/qa.log 2>&1
          node tests/wave-stability-v197.mjs >> /tmp/qa.log 2>&1
          node tests/readability-v198.mjs >> /tmp/qa.log 2>&1
          node tests/info-cleanup-v199.mjs >> /tmp/qa.log 2>&1
      - name: Record automated QA result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUILD='${{ steps.build.outcome }}'
          INSTALL='${{ steps.install.outcome }}'
          GAMEPLAY='${{ steps.gameplay.outcome }}'
          RESULT=PASS
          test "$BUILD" = success || RESULT=FAIL
          test "$INSTALL" = success || RESULT=FAIL
          test "$GAMEPLAY" = success || RESULT=FAIL
          cat > docs/AUTOMATED_QA_RESULT.md <<EOF
          # Automated QA Result — Word Guardians

          Result: $RESULT
          Tested Commit: \`$GITHUB_SHA\`
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Live URL: https://o-some.github.io/word-guardians/
          Build: $BUILD
          Browser install: $INSTALL
          Gameplay QA: $GAMEPLAY

          Profiles attempted:
          - Desktop Chromium 1440×900
          - Desktop WebKit 1440×900
          - Android-like Chromium 390×844
          - iPhone-like WebKit 390×844

          Assets/features checked:
          - regular enemy PNGs and original boss PNGs
          - premium guardians and Tula/UI assets
          - glowing lane-bound boss overlay
          - one free lane rescue rock per lane
          - red Insel-Notruf in the header
          - 3× pause in the action row
          - mobile performance profile
          - premium endscreen additions
          - energy bar between answers and action buttons
          - regular enemy sprites may paint outside their lane without changing lane logic
          - larger typography across standard overlay windows
          - larger 3:00 healing milestone popup and scaling heal percentages
          - larger 2:00 answer-damage milestone and +1 percent per second up to +100 percent
          - premium guardian sprites on the streamlined start guide
          - larger v1.9.6 mobile question/answer area and six guardian cards/sprites
          - v1.9.7 correct-answer word-wave no longer changes page/game width
          - v1.9.8 larger action-button text and maximized premium start-screen typography/sprites
          - v1.9.8 removes the 1.000/2.000 damage example from the minute-two popup
          - v1.9.9 removes only the duplicated compact six-helper summary from Helfer-Info while preserving the detailed helper entries
          - start-to-info morph and 60-second Insel-Notruf

          Note: WebKit mobile emulation is not a physical iPhone Safari device test.

          ## Build log
          \`\`\`
          $(cat /tmp/build.log 2>/dev/null || true)
          \`\`\`

          ## Browser install log (tail)
          \`\`\`
          $(tail -80 /tmp/install.log 2>/dev/null || true)
          \`\`\`

          ## Gameplay QA log
          \`\`\`
          $(cat /tmp/qa.log 2>/dev/null || true)
          \`\`\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTOMATED_QA_RESULT.md
          git commit -m "Record automated migration QA result"
          git pull --rebase origin main
          git push origin HEAD:main
          test "$RESULT" = PASS
