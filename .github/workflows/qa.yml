name: Migration QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static build
        run: npm run build
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Live and gameplay QA
        run: node tests/qa.mjs
      - name: Record automated QA result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          TESTED_SHA="$GITHUB_SHA"
          cat > docs/AUTOMATED_QA_RESULT.md <<EOF
          # Automated QA Result — Word Guardians

          Result: PASS
          Tested Commit: \`$TESTED_SHA\`
          Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Live URL: https://o-some.github.io/word-guardians/

          Checks passed:
          - static Node build
          - live page reachable
          - five critical assets reachable without HTTP errors
          - desktop Chromium gameplay flow
          - Android-like Chromium mobile viewport
          - iPhone-like WebKit mobile viewport
          - start, 4×8 board, answers, placement, HP bar, wrong-answer 10% damage
          - helper move, info, pause/resume
          - 24 correct-answer progression to higher danger level
          - motivational result screen and restart
          - no captured JavaScript page errors / relevant HTTP >=400 responses

          Note: WebKit mobile emulation is not a physical iPhone Safari device test.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTOMATED_QA_RESULT.md
          git commit -m "Record automated migration QA pass"
          git pull --rebase origin main
          git push origin HEAD:main
