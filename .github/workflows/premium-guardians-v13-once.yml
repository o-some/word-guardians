name: Premium Guardians V13 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/premium-guardians-v13-once.yml']

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Import premium art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/guardians assets/ui
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F2a967cf8-f21e-4902-a134-b31a4fe6a07f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKj6n_bLJyWWhGRVg2urASpGJIZNSnvh1tEri8Eihuom&exp=1787233864&osig=AAAAAAAAAAAAAAAAAAAAADqpOo2ZN5W2IvemC0nnSVwBL2JwpwUmtgm-LtdPK5Pg&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-01-wortkoralle.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F320164fb-0fdd-4c29-84e2-bbb41fac3a9f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGXW-stErzJWLJ_8fTvLqHh3ThBFGA3st3gnIthAh8Am&exp=1787232399&osig=AAAAAAAAAAAAAAAAAAAAAB0tLKBx9fF6o-Ul2awtRyGm1xMqhq4hjIu6DSOWg7uq&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-02-steinmuschel.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F3efe32a6-99bd-42d6-b1d4-42b282754bf0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAPSwn71olKwYTmUV7kfif0K4ii3Rn6Jvlm79RjSqpYnq&exp=1787232374&osig=AAAAAAAAAAAAAAAAAAAAAOK2R4zmw2aiGzhFFQ-oVCKlASCL5CJGITord6tg4oqp&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-03-minzqualle.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8a05d5c9-01fa-4199-a09a-c18ea658c0de/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAH-3ITS88aPtcZiW7-O0ATALL5z5QqPs_MyXhrplUv-8&exp=1787234023&osig=AAAAAAAAAAAAAAAAAAAAAK3xuAEgjfwSuJArrvyy_aM8i9W0jr_TIUg9e5cW8iGU&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-04-gezeitenstern.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F59702165-82e2-4d46-b8f3-6f34bc27b8f0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAALhghUO0aGaarcQ77XxhC-s8tgO-7ZIbyrjcOFQIl95v&exp=1787233354&osig=AAAAAAAAAAAAAAAAAAAAAG7ugXXVQZH6Rn-s5VvhpfD45vBlltVJAnOFt9L2oVjA&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-05-blitzkoralle.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F8757d8bc-8d42-481b-83f9-30fd39669bfd/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAON4THy9wrBq8Aay6t5qX6IfCjaeV2Lf4iH1efL_Qz0e&exp=1787232476&osig=AAAAAAAAAAAAAAAAAAAAAA2HiyiNHm4aqQ8EIXORGnAx_AECXPR1_C-H0OlnbNto&signer=media-rpc&x-canva-quality=thumbnail' -o assets/guardians/guardian-06-ankerkrabbe.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F6adc523a-bacd-47c0-a108-5de0b4c18783/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACwWDQNhQlDDGBt2ZPrF_DDfUEgfQPK59rykfmo35Hou&exp=1787232224&osig=AAAAAAAAAAAAAAAAAAAAANoAn74Ayw3b7DGTHaxwDif7yP5qu1VA1Ys3-jP_ZETD&signer=media-rpc&x-canva-quality=thumbnail' -o assets/ui/ui-01-muschel-schatztruhe.png
          curl -L --fail 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F9d9e054a-ab13-47f4-9e4f-a188bd3fd011/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAGap3ar8iXeFO3Oj8GDVBX4qtH_fJugPCcHQ_XXHwM7w&exp=1787233098&osig=AAAAAAAAAAAAAAAAAAAAAHuEvas3hs2GvFOclcJu81sLbOFdmZPp4L547NYTLzBv&signer=media-rpc&x-canva-quality=thumbnail' -o assets/ui/ui-02-boss-rahmen.png
          for f in assets/guardians/*.png assets/ui/*.png; do test -s "$f"; done
      - name: Upgrade gameplay visuals
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=s.replace('v1.2.0 · REAL PIRATES · 4×8','v1.3.0 · PREMIUM GUARDIANS · 4×8')
          css='''.premiumGuardian{object-fit:contain;filter:drop-shadow(0 6px 7px #001522aa) drop-shadow(0 0 5px #77e9df55)}.guardianWrap .premiumGuardian{width:58px;height:58px}.card .premiumGuardian{width:55px;height:55px;margin:0 auto}.gitem .premiumGuardian{width:42px;height:42px;vertical-align:middle}.baseChest{width:54px!important;height:54px!important;object-fit:contain;filter:drop-shadow(0 5px 7px #001522aa) drop-shadow(0 0 9px #ffe18a77);animation:chestPulse 2s ease-in-out infinite}.bossStage{position:relative;margin:7px 0;min-height:132px;padding:10px 14px 10px 142px;border:1px solid #efc766b8;border-radius:20px;background:linear-gradient(110deg,#041d35f4,#07506ae8,#052941f4);box-shadow:0 12px 28px #0008;display:flex;flex-direction:column;justify-content:center;overflow:visible}.bossStage.hidden{display:none!important}.bossVisual{position:absolute;left:8px;top:50%;width:126px;height:126px;transform:translateY(-50%)}.bossFrameDecor{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.bossPortrait{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);max-width:76px;max-height:82px;object-fit:contain;filter:drop-shadow(0 7px 7px #000b) drop-shadow(0 0 10px #ffe18a88);animation:bossFloat 1.35s ease-in-out infinite}.bossEyebrow{font-size:.45rem;letter-spacing:.13em;color:#ffdc7d;font-weight:950}.bossName{font:900 clamp(1rem,3vw,1.35rem) Georgia;color:#fff1bf}.bossLane,.bossHpText,.bossHint{font-size:.53rem;color:#bfe8e6}.bossHpTrack{height:14px;border-radius:99px;background:#101f2b;border:1px solid #efc766aa;overflow:hidden;margin-top:6px}.bossHpTrack i{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ff8c4d,#ffd268);transition:width .16s}.bossHpText{font-weight:900;color:#ffe7a6;margin-top:3px}@keyframes chestPulse{50%{transform:translateY(-3px) scale(1.05)}}@keyframes bossFloat{0%,100%{transform:translate(-50%,-48%) rotate(-1deg)}50%{transform:translate(-50%,-54%) rotate(1deg)}}@media(max-width:520px){.guardianWrap .premiumGuardian{width:44px;height:44px}.card .premiumGuardian{width:43px;height:43px}.card{min-height:88px}.baseChest{width:43px!important;height:43px!important}.bossStage{min-height:105px;padding:8px 8px 8px 104px}.bossVisual{left:3px;width:98px;height:98px}.bossPortrait{max-width:58px;max-height:62px}.bossHint{display:none}}'''
          s=s.replace('</style>',css+'</style>',1)
          new='''const GUARDIAN_ASSETS={coral:'./assets/guardians/guardian-01-wortkoralle.png',shell:'./assets/guardians/guardian-02-steinmuschel.png',jelly:'./assets/guardians/guardian-03-minzqualle.png',star:'./assets/guardians/guardian-04-gezeitenstern.png',bolt:'./assets/guardians/guardian-05-blitzkoralle.png',crab:'./assets/guardians/guardian-06-ankerkrabbe.png'};\nfunction guardianArt(type){return `<img class="guardianArt premiumGuardian guardian-${type}" src="${GUARDIAN_ASSETS[type]}" alt="${G[type].name}">`}\nfunction reset()'''
          s,n=re.subn(r'function guardianSvg\(type\)\{.*?\}\nfunction reset\(\)',new,s,flags=re.S)
          if n!=1: raise SystemExit('guardian function patch failed')
          s=s.replace('guardianSvg(','guardianArt(')
          old='if(c===0){b.innerHTML=\'<img src="./assets/creative/tula_neutral_front.webp" alt="Tula">\';b.disabled=true}'
          newbase='if(c===0){b.innerHTML=\'<img class="baseChest" src="./assets/ui/ui-01-muschel-schatztruhe.png" alt="Muschel-Depot" title="Muschel-Depot">\';b.disabled=true}'
          if old not in s: raise SystemExit('base patch failed')
          s=s.replace(old,newbase,1)
          marker='<section class="boardBox" id="boardBox">'
          stage='<section id="bossStage" class="bossStage hidden"><div class="bossVisual"><img class="bossFrameDecor" src="./assets/ui/ui-02-boss-rahmen.png" alt=""><img id="bossPortrait" class="bossPortrait" alt="Boss"></div><div class="bossEyebrow">⚔ BOSS-ANGRIFF</div><div id="bossName" class="bossName">Boss</div><div id="bossLane" class="bossLane"></div><div class="bossHpTrack"><i id="bossHpFill"></i></div><div id="bossHpText" class="bossHpText"></div><div class="bossHint">Löse Wörter: Die Wortwelle ist deine stärkste Waffe.</div></section>'
          s=s.replace(marker,stage+marker,1)
          oldlane="$$('.lane').forEach((lane,r)=>{lane.querySelectorAll('.enemy').forEach(n=>n.remove());S.e.filter(e=>e.r===r).forEach(e=>{"
          boss="const activeBoss=S.e.find(e=>e.cl.includes('boss')&&e.hp>0);const bs=$('bossStage');if(activeBoss){bs.classList.remove('hidden');$('bossPortrait').src=activeBoss.asset;$('bossName').textContent=activeBoss.n;$('bossLane').textContent='greift Spur '+(activeBoss.r+1)+' an · Distanz '+Math.max(0,Math.round(activeBoss.x))+' %';$('bossHpFill').style.width=Math.max(0,activeBoss.hp/activeBoss.max*100)+'%';$('bossHpText').textContent=Math.max(0,Math.ceil(activeBoss.hp))+' / '+activeBoss.max+' HP'}else bs.classList.add('hidden');$$('.lane').forEach((lane,r)=>{lane.querySelectorAll('.enemy').forEach(n=>n.remove());S.e.filter(e=>e.r===r&&!e.cl.includes('boss')).forEach(e=>{"
          if oldlane not in s: raise SystemExit('boss render patch failed')
          s=s.replace(oldlane,boss,1)
          s=s.replace('Die acht Piraten-Gegner sind jetzt echte Tula-Style-Sprites. In den Bossrunden treten die 10 freigestellten Original-Bosse von Pirat Kai bis Piratenkönig Varkos an.','Premium-Wächter, Muschel-Depots und eine eigene Boss-Arena: Löse Wörter und halte die Piraten auf.')
          p.write_text(s)
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          grep -q 'v1.3.0 · PREMIUM GUARDIANS · 4×8' index.html
          grep -q 'id="bossStage"' index.html
          rm -f .github/workflows/premium-guardians-v13-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add premium guardians, shell depots and external boss arena'
          git pull --rebase origin main
          git push origin HEAD:main
