name: Import Generated Enemy Sprites Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-enemy-assets-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download generated enemy sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/enemies
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F32128a63-f2a2-4bbf-98de-94ec1e91b411/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAC9T6BCk-PwJvqClTrF8hVhYCLCw_dBGgKK7fhPwvz3l&exp=1787227716&osig=AAAAAAAAAAAAAAAAAAAAAAi4SYHUlJhMeT053Ey54fWQNGPlN6-gqWbSC8yR9mmm&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-01-deckhand-niko.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fb9968abb-8946-471f-9269-567498c97fb4/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAJBFkD_7dxcLBtRi6GMrJpOQR3JDdXWp0ISDjOu_rnm-&exp=1787228256&osig=AAAAAAAAAAAAAAAAAAAAAHMyfineHJuBvsmhkzWVX-LwgIVV63XALL1Zc7EYs_he&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-02-hook-scout-lio.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F75e8d36b-1f96-4046-a47d-ba42a5cee80f/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAADdQ10ULjcyn_eOHmPZMdKcX9poS_6u1oPGo-kprkBBf&exp=1787229840&osig=AAAAAAAAAAAAAAAAAAAAAEjhGdhDU1C2-iY--l74woxMH9Fg0IDmvSV63TWlAIRF&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-03-barrel-raider-mako.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F4353245b-5006-40bd-abbe-8b8ba23ad3a1/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAABHaivfe27B1iKVVKg6dv5HLJNzumuZT_VZsyzWcFAm0&exp=1787229757&osig=AAAAAAAAAAAAAAAAAAAAAHtc6myLymH0Vgb_mYIJomazWB81hYC3nOmTRGWCCSSd&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-04-shield-buccaneer-taro.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F09d4fb90-579d-4a04-902b-82f846a9e280/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAL5m111NMJvcMC_CHR0eARzfqMFghT1wWCe3Y9Bp0l-k&exp=1787229421&osig=AAAAAAAAAAAAAAAAAAAAALZPFhGc5GTuX2ElQsrnmy1rqO4l9GcsV0CttOX9TAPl&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-05-wave-skater-piko.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F9a04d7ca-fbea-40b2-a7bf-5bd842050bba/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAACT58wbCyLZhAuBuoLNcKiCsG0zTK8GhrHlzBqACkUQU&exp=1787228436&osig=AAAAAAAAAAAAAAAAAAAAAK8mAjJoSSo2dlKRp7NXUewdTsQTq6rJZhavsPHHjwr6&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-06-anchor-brute-koda.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F70313503-31ce-4491-a3ac-4e6bcf6405d1/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAKJ6rdqGun7hOy70233-VwMuARg8-Cc-RTr4ALWj6til&exp=1787230225&osig=AAAAAAAAAAAAAAAAAAAAAA3Ohd2rG3V1UvdjOVXwYB5G1MMK8mxasf3XhJXuSnxM&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-07-tidecaller-yara.png
          curl -L --fail --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F39d6b02c-5a29-48e1-8c90-190e3456cf0d/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAA32sIm_HXazunTq3pUG2hyxRLuE-F-w30SG420wXfsZ&exp=1787227456&osig=AAAAAAAAAAAAAAAAAAAAADDPlG68OppcSdy7eIesKDeWk5nBay9mHWzoFLaozbxa&signer=media-rpc&x-canva-quality=thumbnail' -o assets/enemies/enemy-08-cannon-corsair-riven.png
          test "$(find assets/enemies -type f -name 'enemy-*.png' | wc -l)" -eq 8
          for f in assets/enemies/enemy-*.png; do test -s "$f"; file "$f" | grep -qi PNG; done

      - name: Commit enemy assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-enemy-assets-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/enemies .github/workflows/import-enemy-assets-once.yml
          git commit -m 'Import generated Tula-style enemy sprites'
          git pull --rebase origin main
          git push origin HEAD:main
