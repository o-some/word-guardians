name: UI Cleanup V161 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-cleanup-v161-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify clean action UI
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/patches/top-pause-v160.js
          grep -q "v1.6.1 · CLEAN ACTIONS · 4×8" assets/patches/top-pause-v160.js
          grep -q ".status{display:none!important}" assets/patches/top-pause-v160.css
          grep -q ".topPauseBtn{display:none!important}" assets/patches/top-pause-v160.css
          grep -q "#infoBtn" assets/patches/top-pause-v160.css
          grep -q "#moveBtn" assets/patches/top-pause-v160.css
          grep -q "#pauseBtn" assets/patches/top-pause-v160.css
          if grep -q "hud.appendChild" assets/patches/top-pause-v160.js; then echo 'Top pause creation still present'; exit 1; fi
          npm run build
          grep -q "top-pause-v160.css" dist/index.html
          grep -q "top-pause-v160.js" dist/index.html
          test -s dist/index.html
      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ui-cleanup-v161-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Verify clean action UI v1.6.1'
          git pull --rebase origin main
          git push origin HEAD:main
